[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coacd_gpu"
version = "0.1.0"
description = "GPU-accelerated kernels for approximate convex decomposition (Hausdorff distance, merge costs)"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.urls]
Repository = "https://github.com/user/coacd_gpu"

[tool.setuptools.packages.find]
# Disable auto-discovery; setup.py handles package_dir mapping
where = ["."]
include = []
