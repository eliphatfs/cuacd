name: Build and run tests

on:
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux wheels (+fatbin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_ARCHS: auto64
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BEFORE_ALL_LINUX: bash ci/setup_manylinux.sh
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_SKIP: pp* *-musllinux_*
          CIBW_BUILD: cp310-*
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            pip install -U auditwheel patchelf &&
            auditwheel repair -w {dest_dir} {wheel} --exclude libcuda.so.1
          # Target every GPU from Volta (sm_70) through Blackwell (sm_120).
          # The fatbin also embeds compute_120 PTX, so newer/future GPUs run
          # the kernels through driver-side JIT.
          CIBW_ENVIRONMENT_LINUX: >-
            CUDA_HOME="/usr/local/cuda"
            CUACD_GPU_ARCHS="70;72;75;80;86;87;89;90;100;120"

      # The fatbinary is PTX + cubins only — no host code — so the one built
      # here is reusable everywhere. Windows consumes it as-is and never
      # needs nvcc, a CUDA install, or a CUDA-blessed MSVC toolchain.
      - name: Export fatbin from the built wheel
        shell: bash
        run: |
          mkdir -p fatbin
          python -c "
          import glob, shutil, zipfile
          whl = glob.glob('wheelhouse/cuacd-*.whl')[0]
          with zipfile.ZipFile(whl) as z, open('fatbin/kernels.fatbin', 'wb') as out:
              shutil.copyfileobj(z.open('cuacd/kernels.fatbin'), out)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: fatbin
          path: fatbin/kernels.fatbin
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-ubuntu-latest
          path: ./wheelhouse/*.whl

  build-windows:
    name: Windows wheels (host only)
    needs: build-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fatbin
          path: fatbin

      # Staged where setup.py looks by default (CUACD_FATBIN unset): the
      # extension is then compiled without nvcc and the fatbin is packaged
      # verbatim.
      - name: Stage prebuilt fatbin
        shell: bash
        run: |
          mkdir -p cuacd
          cp fatbin/kernels.fatbin cuacd/kernels.fatbin

      # No CUDA installer, no nvcc: only the small host C extension is
      # compiled, and the driver headers/import lib come from the build dep
      # nvidia-cuda-runtime-cu12 (declared in pyproject's build-system.requires
      # so it lands inside pip's isolated build environment).
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_ARCHS: auto64
          CIBW_BUILD_VERBOSITY: 1
          CIBW_SKIP: pp* *-musllinux_*
          CIBW_BUILD: cp310-*

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-latest
          path: ./wheelhouse/*.whl

  run:
    name: Test on ${{ matrix.os }} with python ${{ matrix.python-version }}
    needs: [build-linux, build-windows]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: built_wheels

      - name: Install packages
        shell: bash
        run: |
          python - <<'PY'
          import glob, subprocess, sys
          wheels = glob.glob("built_wheels/cuacd-*.whl")
          assert len(wheels) == 1, f"expected exactly 1 cuacd wheel, got {wheels}"
          subprocess.check_call([sys.executable, "-m", "pip", "install", wheels[0]])
          PY

      # The kernels need a GPU, which the hosted runners do not have, so we only
      # verify that the (abi3) wheel installs and its metadata is readable.
      - name: Check install
        run: python -c "import importlib.metadata as m; print('cuacd', m.version('cuacd'))"
