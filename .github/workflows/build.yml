name: Build wheels

on:
  workflow_dispatch:
    inputs:
      cuda_version:
        description: "CUDA toolkit version"
        required: false
        default: "12.6.3"
      archs:
        description: "GPU architectures (semicolon-separated sm_ values)"
        required: false
        default: "80;86;89;90"

jobs:
  build-manylinux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build manylinux wheel
        uses: RalfG/python-wheels-manylinux-build@v0.7.1
        with:
          python-versions: "cp310"
          build-requirements: "setuptools>=64 wheel numpy"
          pip-wheel-args: "--no-deps -w dist/"
          pre-build-command: |
            export CUDA_VERSION=${{ inputs.cuda_version }} &&
            export CUDA_MAJOR=${CUDA_VERSION%%.*} &&
            export CUDA_RUN=cuda_${CUDA_VERSION}_linux.run &&
            echo "Downloading CUDA ${CUDA_VERSION} network installer..." &&
            curl -fsSL -o ${CUDA_RUN} https://developer.download.nvidia.com/compute/cuda/${CUDA_VERSION}/local_installers/${CUDA_RUN} &&
            chmod +x ${CUDA_RUN} &&
            ./${CUDA_RUN} --silent --toolkit --toolkitpath=/usr/local/cuda-${CUDA_MAJOR} &&
            ln -sf /usr/local/cuda-${CUDA_MAJOR}/bin/nvcc /usr/local/bin/nvcc &&
            echo "CUDA_HOME=/usr/local/cuda-${CUDA_MAJOR}" >> "$GITHUB_ENV" &&
            echo "CUACD_GPU_ARCHS=${{ inputs.archs }}" >> "$GITHUB_ENV" &&
            nvcc --version

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manylinux-wheels
          path: dist/*.whl

