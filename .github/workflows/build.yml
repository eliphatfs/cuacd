name: Build wheels

on:
  workflow_dispatch:
    inputs:
      cuda_version:
        description: "CUDA toolkit version"
        required: false
        default: "12.6.3"
      archs:
        description: "GPU architectures (semicolon-separated sm_ values)"
        required: false
        default: "80;86;89;90"

jobs:
  build-manylinux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build manylinux wheel
        uses: RalfG/python-wheels-manylinux-build@v0.7.1
        with:
          build-requirements: "setuptools>=64 wheel numpy"
          pip-wheel-args: "--no-deps -w dist/"
          pre-build-command: |
            CUDA_VERSION=${{ inputs.cuda_version }}
            CUDA_KEYRING=https://developer.download.nvidia.com/compute/cuda/repos/rhel9/x86_64/cuda-keyring_1.1-1_all.deb
            curl -fsSL "$CUDA_KEYRING" -o /tmp/cuda-keyring.deb
            rpm --import https://developer.download.nvidia.com/compute/cuda/repos/rhel9/x86_64/D42D0685.pub
            yum install -y /tmp/cuda-keyring.deb
            yum install -y cuda-nvcc-${CUDA_VERSION/./-} cuda-cudart-devel-${CUDA_VERSION/./-}
            ln -sf /usr/local/cuda-${CUDA_VERSION%.*}/bin/nvcc /usr/local/bin/nvcc
            export CUDA_HOME=/usr/local/cuda-${CUDA_VERSION%.*}
            echo "CUDA_HOME=$CUDA_HOME" >> "$GITHUB_ENV"
            echo "CUACD_GPU_ARCHS=${{ inputs.archs }}" >> "$GITHUB_ENV"
            nvcc --version

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manylinux-wheels
          path: dist/*.whl

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: "${{ inputs.cuda_version }}"
          method: "network"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install setuptools>=64 wheel numpy

      - name: Build wheel
        env:
          CUACD_GPU_ARCHS: "${{ inputs.archs }}"
        run: pip wheel --no-deps -w dist/ .

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-wheels
          path: dist/*.whl
