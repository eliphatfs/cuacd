[build-system]
requires = ["setuptools>=77", "wheel", "nvidia-cuda-runtime-cu12==12.9.79"]
build-backend = "setuptools.build_meta"

[project]
name = "cuacd"
version = "0.1.0"
description = "GPU-accelerated approximate convex decomposition"
license = "LGPL-2.1-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy", "trimesh", "scipy", "rtree"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/eliphatfs/cuacd"

[project.scripts]
cuacd = "cuacd.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cuacd", "cuacd.*"]

[tool.setuptools.package-data]
cuacd = ["kernels.fatbin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
