[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuacd"
version = "0.1.0"
description = "GPU-accelerated approximate convex decomposition"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy", "trimesh", "scipy", "rtree"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/eliphatfs/cuacd"

[project.scripts]
cuacd = "cuacd.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cuacd", "cuacd.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
