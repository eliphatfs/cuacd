[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coacd_gpu"
version = "0.1.0"
description = "GPU-accelerated approximate convex decomposition"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "trimesh", "scipy", "rtree"]

[project.urls]
Repository = "https://github.com/eliphatfs/coacd-gpu"

[tool.setuptools.packages.find]
where = ["."]
include = ["coacd_gpu", "coacd_gpu.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
